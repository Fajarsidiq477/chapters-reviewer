<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter Review</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">

    <section id="screen-login" class="card">
      <h1>Chapter Review Quiz</h1>
      <p class="subtitle">Enter your details and the packet code your teacher gave you to begin.</p>

      <form id="login-form">
        <label for="input-fullname">Full Name</label>
        <input type="text" id="input-fullname" autocomplete="name" required>

        <label for="input-class">Class</label>
        <input type="text" id="input-class" placeholder="e.g. 10A" required>

        <label for="input-token">Packet Code</label>
        <input type="text" id="input-token" placeholder="e.g. NET4-100" required>

        <div style="margin-top:20px;">
          <button type="submit" class="btn-primary" id="btn-start">Start Review</button>
        </div>
        <div id="login-error" class="error-box" hidden></div>
      </form>
    </section>

    <section id="screen-quiz" class="card" hidden>
      <div class="quiz-header">
        <h2 id="quiz-title">Packet</h2>
        <div class="timer" id="quiz-timer">--:--</div>
      </div>
      <div class="progress-text" id="quiz-progress"></div>
      <div id="quiz-section-title" style="font-weight:700; margin-bottom:10px;"></div>
      <div id="quiz-questions"></div>

      <div class="quiz-nav">
        <button type="button" class="btn-secondary" id="btn-prev">Previous</button>
        <div class="right-group">
          <button type="button" class="btn-secondary" id="btn-next">Next</button>
          <button type="button" class="btn-primary" id="btn-submit">Submit Quiz</button>
        </div>
      </div>
    </section>

    <section id="screen-result" class="card" hidden>
      <h2 id="result-title">Submitted!</h2>
      <div id="result-body"></div>
      <div style="margin-top:20px;">
        <button type="button" class="btn-secondary" id="btn-restart">Back to start</button>
      </div>
    </section>

  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
